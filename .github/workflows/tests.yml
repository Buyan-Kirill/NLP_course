name: HW01 CPU contracts
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hw01/requirements*.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python -m unittest discover -s tests
      - run: python -m reproduction.build_report
      - run: python -m reproduction.check_links
